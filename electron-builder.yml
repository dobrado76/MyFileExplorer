appId: com.myfileexplorer.app
productName: MyFileExplorer
# No publish providers — GitHub Actions attaches installers to Releases.
# (A git tag would otherwise make electron-builder publish and fail without GH_TOKEN.)
publish: []
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
  - node_modules/onnxruntime-web/**
  - node_modules/onnxruntime-common/**
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/koffi/**
  - node_modules/@koromix/koffi-*/**
  - node_modules/onnxruntime-web/dist/**
  - node_modules/ffmpeg-static/**
  - node_modules/7zip-bin/**
  - node_modules/node-unrar-js/**
win:
  icon: build/icon.ico
  target:
    - nsis
linux:
  icon: build/icon.png
  # Experimental: AppImage only for now (snap packaging is optional later).
  target:
    - AppImage
  category: Utility
protocols:
  - name: MyFileExplorer
    schemes:
      - mfe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Hyphens survive GitHub asset upload (spaces become dots and older Check-for-update
  # builds could not read a version from MyFileExplorer.Setup.0.x.y.exe).
  artifactName: ${productName}-${version}.${ext}
  # Settings live in %APPDATA%\MyFileExplorer — never wipe on uninstall/reinstall.
  deleteAppDataOnUninstall: false
electronLanguages:
  - en-US
