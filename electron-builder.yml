appId: com.myfileexplorer.app
productName: MyFileExplorer
# No publish providers — GitHub Actions attaches installers to Releases.
# (A git tag would otherwise make electron-builder publish and fail without GH_TOKEN.)
publish: []
# NSIS 7z still uses -mx=9 unless ELECTRON_BUILDER_COMPRESSION_LEVEL is set
# (see scripts/build-win.mjs). `normal` only affects zip / non-7z targets.
compression: normal
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
  - node_modules/onnxruntime-web/**
  - node_modules/onnxruntime-common/**
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/koffi/**
  - node_modules/@koromix/koffi-*/**
  - node_modules/onnxruntime-web/dist/**
  - node_modules/ffmpeg-static/**
  - node_modules/7zip-bin/**
  - node_modules/node-unrar-js/**
win:
  icon: build/icon.ico
  # Skip Authenticode. CSC_IDENTITY_AUTO_DISCOVERY is macOS-only — without this,
  # electron-builder still logs/runs signtool on every packed exe (and timestamps
  # each one if a local cert exists — minutes of DigiCert waits).
  signExecutable: false
  target:
    - nsis
linux:
  icon: build/icon.png
  # Experimental: AppImage only for now (snap packaging is optional later).
  target:
    - AppImage
  category: Utility
protocols:
  - name: MyFileExplorer
    schemes:
      - mfe
fileAssociations:
  - ext: mfevirtual
    name: MyFileExplorer Virtual Folder
    description: MyFileExplorer Virtual Folder
    role: Editor
    mimeType: application/x-myfileexplorer-virtualfolder
extraFiles:
  - from: tools/MfeShellLauncher/publish/MfeShellLauncher.exe
    to: MfeShellLauncher.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/nsis-shell-redirect-uninstall.nsh
  # Hyphens survive GitHub asset upload (spaces become dots and older Check-for-update
  # builds could not read a version from MyFileExplorer.Setup.0.x.y.exe).
  artifactName: ${productName}-${version}.${ext}
  # Settings live in %APPDATA%\MyFileExplorer — never wipe on uninstall/reinstall.
  deleteAppDataOnUninstall: false
electronLanguages:
  - en-US
