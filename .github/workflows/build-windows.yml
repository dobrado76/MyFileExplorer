# Check on every PR/push. Build the NSIS installer only for version tags and
# attach it to a GitHub Release — no Actions artifact storage (quota-free).
name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

  release:
    name: Windows installer → GitHub Release
    needs: check
    # Only tagged releases ship an installer (no Actions artifacts).
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        env:
          # No code-signing cert in CI — skip discovery so the build does not hang.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win

      - name: Attach installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MyFileExplorer Setup *.exe
            dist/*.exe.blockmap
            dist/latest.yml
          generate_release_notes: true
          fail_on_unmatched_files: true
