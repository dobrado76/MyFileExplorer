# Check on every PR/push. Build the NSIS installer only for version tags and
# attach it to a GitHub Release — no Actions artifact storage (quota-free).
name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Install WinFsp (projection service build)
        run: choco install winfsp -y --no-progress
        continue-on-error: false

      - name: Test Virtual Folder projection service
        run: |
          dotnet restore tools/MfeVirtualFolderService/MfeVirtualFolderService.sln
          dotnet test tools/MfeVirtualFolderService/tests/MfeVirtualFolder.Protocol.Tests -c Release --no-restore
          dotnet build tools/MfeVirtualFolderService/src/MfeVirtualFolderService/MfeVirtualFolderService.csproj -c Release --no-restore

      - name: Build shell redirect launcher
        run: |
          $pub = "tools/MfeShellLauncher/publish"
          dotnet publish tools/MfeShellLauncher/src/MfeShellLauncher/MfeShellLauncher.csproj `
            -c Release -r win-x64 `
            -p:PublishSingleFile=true `
            -o $pub
          if (-not (Test-Path "$pub/MfeShellLauncher.exe")) {
            throw "Publish output missing MfeShellLauncher.exe"
          }

  release:
    name: Windows installer → GitHub Release
    needs: check
    # Only tagged releases ship an installer (no Actions artifacts).
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Install WinFsp (HAS_WINFSP for Mount support)
        run: choco install winfsp -y --no-progress

      - name: Publish Virtual Folder projection service
        run: |
          $pub = "tools/MfeVirtualFolderService/publish"
          dotnet publish tools/MfeVirtualFolderService/src/MfeVirtualFolderService/MfeVirtualFolderService.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o $pub
          if (-not (Test-Path "$pub/MfeVirtualFolderService.exe")) {
            throw "Publish output missing MfeVirtualFolderService.exe"
          }

      - name: Package projection service zip
        shell: pwsh
        run: |
          $stage = "dist/MfeVirtualFolderService-win-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "tools/MfeVirtualFolderService/publish/MfeVirtualFolderService.exe" $stage/
          Copy-Item "tools/MfeVirtualFolderService/packaging/*" $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/MfeVirtualFolderService-win-x64.zip" -Force
          Get-Item "dist/MfeVirtualFolderService-win-x64.zip" | Format-List Name, Length

      - name: Publish shell redirect launcher
        run: |
          $pub = "tools/MfeShellLauncher/publish"
          dotnet publish tools/MfeShellLauncher/src/MfeShellLauncher/MfeShellLauncher.csproj `
            -c Release -r win-x64 `
            -p:PublishSingleFile=true `
            -o $pub
          if (-not (Test-Path "$pub/MfeShellLauncher.exe")) {
            throw "Publish output missing MfeShellLauncher.exe"
          }

      - name: Build NSIS installer
        env:
          # No code-signing cert in CI — skip discovery so the build does not hang.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win

      - name: Verify shell redirect launcher in installer payload
        run: |
          if (-not (Test-Path "dist/win-unpacked/MfeShellLauncher.exe")) {
            throw "MfeShellLauncher.exe missing from dist/win-unpacked (extraFiles)"
          }
          if (-not (Test-Path "dist/win-unpacked/MyFileExplorer.exe")) {
            throw "MyFileExplorer.exe missing from dist/win-unpacked"
          }

      - name: Attach installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MyFileExplorer-*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/MfeVirtualFolderService-win-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
